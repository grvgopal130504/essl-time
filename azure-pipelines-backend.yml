# Azure DevOps pipeline — deploys backend/ to Azure App Service (Linux, Node)
#
# Pipeline variables required (Pipelines → Edit → Variables):
#   azureServiceConnection   name of your ARM service connection
#   webAppName               e.g. essl-adms
#
# See AZURE-DEVOPS-STEPS.md for the click-by-click setup.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*
      - azure-pipelines-backend.yml

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22.x"

stages:
  - stage: Build
    displayName: Build backend
    jobs:
      - job: build
        steps:
          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci --omit=dev
            displayName: Install production dependencies
            workingDirectory: backend

          # Package the contents of backend/ — NOT the folder itself, so that
          # src/server.js sits at the root of the zip where App Service expects it.
          - task: ArchiveFiles@2
            displayName: Archive backend
            inputs:
              rootFolderOrFile: backend
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/backend.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/backend.zip
            artifact: backend

  - stage: Deploy
    displayName: Deploy to App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend

                - task: AzureWebApp@1
                  displayName: Deploy to $(webAppName)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/backend/backend.zip
                    runtimeStack: "NODE|22-lts"
                    startUpCommand: "node src/server.js"
